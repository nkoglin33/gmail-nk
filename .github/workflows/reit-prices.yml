name: REIT Weekly price snapshot

# Publishes rw_prices.json (Price / 5D / YTD / 1-Yr for the 19-issuer universe)
# BEFORE the "REIT Weekly Universe Report" routine fires at 12:00 UTC Mondays.
# The routine's sandbox proxy refuses CONNECT to query1.finance.yahoo.com
# (403 Forbidden, every Monday since 2026-08-10); an Actions runner can reach it,
# so the data is collected here and handed to the routine through the repo.

on:
  schedule:
    # Multiple slots because GitHub delays/skips scheduled runs under load (10/5/26: both
    # Monday crons fired ~8h late, at 19:19/19:43 UTC; 10/12/26: neither fired before the
    # routine). The Friday close is final by Friday evening, so start Saturday and keep
    # retrying through Monday morning. The commit step is a no-op when the file is unchanged.
    # NOTE: never schedule on Friday — fetch_reit_prices.py treats a Friday run as covering
    # the PRIOR Friday. Off-the-hour minutes reduce queue delay.
    - cron: '17 2 * * 6'    # Sat 02:17 UTC (Fri 9:17pm CT) — first pull after the Friday close
    - cron: '17 12 * * 0'   # Sun 12:17 UTC — retry
    - cron: '17 6 * * 1'    # Mon 06:17 UTC — retry
    - cron: '47 9 * * 1'    # Mon 09:47 UTC — retry
    - cron: '30 10 * * 1'   # 10:30 UTC Mon — 90 min before the routine
    - cron: '40 11 * * 1'   # 11:40 UTC Mon — last refresh before the routine
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reit-prices
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch prices from Yahoo Finance
        run: python scripts/fetch_reit_prices.py

      - name: Commit rw_prices.json
        run: |
          git config user.name  "reit-prices-bot"
          git config user.email "actions@github.com"
          if [ -z "$(git status --porcelain -- rw_prices.json)" ]; then
            echo "rw_prices.json unchanged — nothing to commit"
            exit 0
          fi
          git add rw_prices.json
          git commit -m "REIT price snapshot $(date -u +%Y-%m-%d) (Yahoo chart API via Actions)"
          git push

# Schedule re-registered 2026-09-28: the 9/21 contents-API commit never armed the
# Monday crons (zero scheduled runs on 9/28); re-pushed via git + disable/enable cycle.
